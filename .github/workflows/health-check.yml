name: Health Check

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: Check public endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public endpoints
        # Full smoke contract from the former ci.yml `smoke` job (removed in
        # cc7559e): HTTP 200 + non-404 visible body per page. The body check
        # catches the error-boundary class (status 200, body says not found).
        run: |
          set -euo pipefail
          for path in "/" "/missions" "/org/SpIob" "/repo/SpIob/deptend-go-test-fixture"; do
            url="https://deptend.vercel.app${path}"
            body=$(mktemp)
            status=$(curl -fsSL -o "$body" -w '%{http_code}' "$url")
            if [[ "$status" != "200" ]]; then
              echo "FAIL: ${url} returned HTTP ${status}"
              cat "$body"
              rm "$body"
              exit 1
            fi
            visible=$(perl -0777 -pe 's|<script[^>]*>.*?</script>||gs; s|<style[^>]*>.*?</style>||gs' "$body" | tr -d '\n')
            if [[ "$visible" == *"404 - not found"* ]]; then
              echo "FAIL: ${url} served a 404 body in production"
              rm "$body"
              exit 1
            fi
            echo "OK: ${url} (HTTP ${status}, $(wc -c <"$body") bytes)"
            rm "$body"
          done
          echo "All health checks passed"

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[DepTend] Health check failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: DepTend Alerts
          body: |
            Workflow: Health Check
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Timestamp: ${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp || 'manual trigger' }}
            Failed endpoints: /, /missions, /org/SpIob, /repo/SpIob/deptend-go-test-fixture
