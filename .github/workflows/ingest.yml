name: Ingest

on:
  # Run daily at 04:00 UTC (off-peak for GitHub API)
  schedule:
    - cron: "0 4 * * *"

  # Allow manual trigger for debugging / replay
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Specific repo UUID to ingest (leave blank for all pending)"
        required: false
        type: string
      triggered_by:
        description: "Who/what triggered this run (manual UI click vs. API-submitted repo)"
        required: false
        type: string
        default: "manual"

# One ingestion run at a time. Overlapping cron/dispatch runs both select
# the same pending repos, and MissionWriter's check-then-insert has no DB
# unique constraint to fall back on (missions table is deliberately
# unconstrained), so interleaved runs could create duplicate missions.
# Queue overlapping triggers instead of cancelling: killing a run between
# openRun and closeRun would strand rows at status "running".
concurrency:
  group: ingest
  cancel-in-progress: false

# Least privilege — checkout + authenticated reads of public repos via
# github.token are all the job needs (no writes to repo state).
permissions:
  contents: read

jobs:
  ingest:
    name: Run ingestion job
    runs-on: ubuntu-latest

    # Only run on the main branch (prevents accidental runs from forks)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          LIBRARIES_IO_API_KEY: ${{ secrets.LIBRARIES_IO_API_KEY }}
          # Routed through env: instead of direct ${{ inputs.* }} interpolation
          # in the run block — the standard mitigation for Actions script
          # injection via workflow_dispatch inputs.
          INPUT_REPO_ID: ${{ inputs.repo_id }}
          INPUT_TRIGGERED_BY: ${{ inputs.triggered_by }}
        run: |
          if [ -n "$INPUT_REPO_ID" ]; then
            node scripts/ingest.js --repo-id "$INPUT_REPO_ID" --triggered-by "$INPUT_TRIGGERED_BY"
          else
            node scripts/ingest.js --triggered-by cron
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Ingestion run failed — see the 'Run ingestion' step above for details."
          echo "## ❌ Ingestion failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Run ingestion** step log for the error." >> "$GITHUB_STEP_SUMMARY"
