name: Ingest

on:
  # Run daily at 04:00 UTC (off-peak for GitHub API)
  schedule:
    - cron: "0 4 * * *"

  # Allow manual trigger for debugging / replay
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Specific repo UUID to ingest (leave blank for all pending)"
        required: false
        type: string
      triggered_by:
        description: "Who/what triggered this run (manual UI click vs. API-submitted repo)"
        required: false
        type: string
        default: "manual"
      send_test_email:
        description: "Send a test email to verify SMTP config (ignored on cron runs)"
        required: false
        type: boolean
        default: false

# One ingestion run at a time. Overlapping cron/dispatch runs both select
# the same pending repos, and MissionWriter's check-then-insert has no DB
# unique constraint to fall back on (missions table is deliberately
# unconstrained), so interleaved runs could create duplicate missions.
# Queue overlapping triggers instead of cancelling: killing a run between
# openRun and closeRun would strand rows at status "running".
concurrency:
  group: ingest
  cancel-in-progress: false

# Least privilege — checkout + authenticated reads of public repos via a
# PAT with public_repo scope (GH_INGEST_TOKEN) are all the job needs.
# The auto-injected github.token only accesses this repository.
# issues: write is required for the circuit breaker step (gh issue create).
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    name: Run ingestion job
    runs-on: ubuntu-latest

    # Only run on the main branch (prevents accidental runs from forks)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Pre-flight validation
        env:
          GH_INGEST_TOKEN: ${{ secrets.GH_INGEST_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # 1. GH_INGEST_TOKEN required (not optional)
          if [[ -z "${GH_INGEST_TOKEN}" ]]; then
            echo "::error::GH_INGEST_TOKEN secret not set — ingestion cannot run authenticated"
            exit 1
          fi
          # 2. Validate token format (ghp_ for classic PAT, github_pat_ for fine-grained PAT)
          if [[ ! "${GH_INGEST_TOKEN}" =~ ^(ghp_|github_pat_) ]]; then
            echo "::error::GH_INGEST_TOKEN format invalid — must start with ghp_ or github_pat_"
            exit 1
          fi
          # 3. Validate token works against GitHub API (this repo)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_INGEST_TOKEN}" https://api.github.com/user)
          if [[ "$code" != "200" ]]; then
            echo "::error::GH_INGEST_TOKEN invalid (HTTP $code)"
            exit 1
          fi
          # 4. Validate token works against target public repos (public_repo scope)
          for repo in "psf/requests" "SpIob/FlowState"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_INGEST_TOKEN}" "https://api.github.com/repos/${repo}")
            if [[ "$code" != "200" ]]; then
              echo "::error::GH_INGEST_TOKEN lacks access to ${repo} (HTTP $code) — ensure public_repo scope"
              exit 1
            fi
          done
          # 5. Validate DATABASE_URL format
          if [[ ! "${DATABASE_URL}" =~ ^postgresql:// ]]; then
            echo "::error::DATABASE_URL malformed"
            exit 1
          fi
          # 6. Validate DATABASE_URL connectivity using Node.js (neon-http driver).
          # sql.query(), not sql(): @neondatabase/serverless >=1.0 removed the
          # conventional-call API — sql('SELECT 1') throws at runtime and killed
          # the 2026-09-24 08:57 UTC cron (run 35978272261) before ingestion.
          node -e "
            const { neon } = require('@neondatabase/serverless');
            const sql = neon(process.env.DATABASE_URL);
            sql.query('SELECT 1').then(() => console.log('DB connection OK')).catch(e => { console.error('DB connection failed:', e.message); process.exit(1); });
          " || exit 1
          # 7. Validate OSV API reachable
          curl -sf https://api.osv.dev/v1/vulns/CVE-2021-44228 >/dev/null || {
            echo "::error::OSV API unreachable"
            exit 1
          }
          # 8. Validate GitHub API rate limit headroom
          rate_limit=$(curl -s -H "Authorization: Bearer ${GH_INGEST_TOKEN}" https://api.github.com/rate_limit | jq -r '.resources.core.remaining')
          if [[ "$rate_limit" -lt 100 ]]; then
            echo "::warning::GitHub API rate limit low: ${rate_limit} remaining"
          fi
          echo "Pre-flight checks passed"

      - name: Send test email (manual trigger only)
        # inputs.send_test_email is a typed workflow_dispatch boolean, so at
        # an `if:` it arrives as a Boolean; comparing it to the STRING 'true'
        # coerces true→1 and 'true'→NaN, and every NaN comparison is false —
        # the step could never run with the old condition, even checked.
        # (The == 'true' string-compare pattern belongs to the
        # github.event.inputs.* context, which stores 'true'/'false' strings.)
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_email == true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[DepTend] Test email — SMTP config verified"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: DepTend Alerts
          body: |
            This is a test email from the DepTend ingestion workflow.
            If you received this, the Gmail SMTP configuration is working correctly.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Triggered by: ${{ github.actor }}
            Timestamp: ${{ github.event.workflow_dispatch.inputs.triggered_by }}

      - name: Run ingestion with retry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_INGEST_TOKEN: ${{ secrets.GH_INGEST_TOKEN }}
          LIBRARIES_IO_API_KEY: ${{ secrets.LIBRARIES_IO_API_KEY }}
          # Routed through env: instead of direct ${{ inputs.* }} interpolation
          # in the run block — the standard mitigation for Actions script
          # injection via workflow_dispatch inputs.
          INPUT_REPO_ID: ${{ inputs.repo_id }}
          INPUT_TRIGGERED_BY: ${{ inputs.triggered_by }}
        run: |
          set -euo pipefail
          # Default triggered_by to "cron" for scheduled runs (inputs.triggered_by is only set for workflow_dispatch)
          TRIGGERED_BY="${INPUT_TRIGGERED_BY:-cron}"
          for attempt in 1 2 3; do
            if node scripts/ingest.js \
                 ${INPUT_REPO_ID:+--repo-id "$INPUT_REPO_ID"} \
                 --triggered-by "$TRIGGERED_BY"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Post-ingestion smoke test
        if: always()
        run: |
          set -euo pipefail
          for path in "/" "/missions" "/org/SpIob"; do
            status=$(curl -fsSL -o /dev/null -w '%{http_code}' "https://deptend.vercel.app${path}")
            if [[ "$status" != "200" ]]; then
              echo "FAIL: ${path} returned HTTP ${status}"
              exit 1
            fi
          done
          echo "All smoke checks passed"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Ingestion run failed — see the 'Run ingestion with retry' step above for details."
          echo "## ❌ Ingestion failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Run ingestion with retry** step log for the error." >> "$GITHUB_STEP_SUMMARY"

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[DepTend] Ingestion failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: DepTend Alerts
          body: |
            Workflow: Ingest
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Triggered by: ${{ github.actor }}

      - name: Circuit breaker (3 consecutive failures)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Get last 3 completed runs for this workflow (excluding in-progress)
          runs=$(gh api repos/${{ github.repository }}/actions/workflows/ingest.yml/runs \
            --jq '.workflow_runs[:5] | map(select(.conclusion != null)) | .[:3] | map(.conclusion) | join(",")')
          if [[ "$runs" == "failure,failure,failure" ]]; then
            # gh issue create fails OUTRIGHT when a label doesn't exist (no
            # auto-create, no issue created), and the old `|| true` on the
            # create swallowed that failure — a real 3-consecutive-failure
            # event would have produced NO issue, silently (neither label
            # existed in the repo). Both labels are now created idempotently
            # in the same step so the issue create can't no-op, and the
            # create itself is no longer swallowed: if it still fails, the
            # error is visible in the run log.
            gh label create "ops:ingest-failure" \
              --color "D93F0B" \
              --description "Ingestion workflow failure (circuit breaker)" \
              || true  # label already exists
            gh label create "blocker" \
              --color "B60205" \
              --description "Requires operator attention / blocks a release" \
              || true  # label already exists
            gh issue create \
              --title "⚠️ Ingest workflow: 3 consecutive failures" \
              --body "The scheduled ingestion workflow has failed 3 times in a row. Latest run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label "ops:ingest-failure,blocker"
          fi
