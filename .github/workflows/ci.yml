name: CI

on:
  push:
    paths:
      - "packages/core/**"
      - "app/**"
      - "cli/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "eslint.config.mjs"
  pull_request:
    paths:
      - "packages/core/**"
      - "app/**"
      - "cli/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "eslint.config.mjs"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # GitHub Actions validates workflow YAML syntax on push; no extra step needed

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck test files
        run: |
          pnpm --filter @deptend/core typecheck:tests
          pnpm --filter cli typecheck:tests

      - name: Typecheck scripts
        run: pnpm --filter scripts typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Test
        run: pnpm test

      - name: Migrations match schema
        run: pnpm exec drizzle-kit check

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pnpm audit --prod

  integration-test:
    name: Integration test (ingest fixture repo)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_INGEST_TOKEN: ${{ secrets.GH_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Run ingestion against fixture repo
        run: |
          node scripts/ingest.js \
            --repo-url https://github.com/SpIob/deptend-go-test-fixture \
            --triggered-by manual
