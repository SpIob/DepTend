name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # packages/core and cli's root typecheck excludes test files by
      # tsconfig scope; this second pass covers them (AGENTS.md §6 step 6).
      # It has independently caught required-field and exactOptionalPropertyTypes
      # violations that steps 1–5 couldn't see, so it runs in CI, not just locally.
      - name: Typecheck test files
        run: |
          pnpm --filter @deptend/core typecheck:tests
          pnpm --filter cli typecheck:tests

      - name: Test
        run: pnpm test
