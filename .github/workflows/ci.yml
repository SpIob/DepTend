name: CI

on: [push]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck test files
        run: |
          pnpm --filter @deptend/core typecheck:tests
          pnpm --filter cli typecheck:tests

      - name: Test
        run: pnpm test

      - name: Migrations match schema
        run: pnpm exec drizzle-kit check

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pnpm audit --prod

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [ci]
    if: secrets.DEV_DATABASE_URL != ''
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @deptend/core build

      - name: Run integration tests
        run: pnpm --filter scripts test -- --run integration.test.js

  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Curl public pages
        run: |
          set -euo pipefail
          declare -a PATHS=(
            "/"
            "/missions"
            "/org/SpIob"
            "/repo/SpIob/deptend-go-test-fixture"
          )
          for path in "${PATHS[@]}"; do
            url="https://deptend.vercel.app${path}"
            body=$(mktemp)
            status=$(curl -fsSL -o "$body" -w '%{http_code}' "$url")
            if [[ "$status" != "200" ]]; then
              echo "FAIL: ${url} returned HTTP ${status}"
              cat "$body"
              rm "$body"
              exit 1
            fi
            visible=$(perl -0777 -pe 's|<script[^>]*>.*?</script>||gs; s|<style[^>]*>.*?</style>||gs' "$body" | tr -d '\n')
            if [[ "$visible" == *"404 - not found"* ]]; then
              echo "FAIL: ${url} served a 404 body in production"
              rm "$body"
              exit 1
            fi
            echo "OK: ${url} (HTTP ${status}, $(wc -c <"$body") bytes)"
            rm "$body"
          done
